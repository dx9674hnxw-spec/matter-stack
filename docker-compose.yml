version: "3.8"

services:
  matter-bridge:
    build: ./bridge
    container_name: matter-bridge
    restart: unless-stopped
    # même mode réseau que ton matter-server existant -> "localhost" fonctionne
    network_mode: host
    environment:
      MATTER_SERVER_URL: "ws://localhost:5580/ws"
      # on écrit DIRECTEMENT dans le dossier de config déjà utilisé par ton
      # container "homepage" existant (celui monté sur /srv/homepage)
      HOMEPAGE_OUTPUT_DIR: "/homepage-config"
      # adresse par laquelle Homepage (côté Traefik/docker) doit joindre ce
      # bridge -> ton IP LAN, car matter-bridge est en network_mode host
      BRIDGE_PUBLIC_URL: "http://192.168.1.100:8182"
      POLL_INTERVAL_SECONDS: "30"
    volumes:
      - /srv/homepage:/homepage-config


version: "3.8"

services:
  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    network_mode: host
    volumes:
      - /opt/matter-server/data:/data:rw
      - /run/dbus:/run/dbus:ro
    command: >
      --storage-path /data
      --paa-root-cert-dir /data/credentials
