version: "3.8"

services:
  matter-bridge:
    build: ./bridge
    container_name: matter-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      MATTER_SERVER_URL: "ws://localhost:5580/ws"
      HOMEPAGE_OUTPUT_DIR: "/homepage-config"
      BRIDGE_PUBLIC_URL: "http://192.168.1.100:8182"
      POLL_INTERVAL_SECONDS: "30"
    volumes:
      - /srv/homepage:/homepage-config


  matter-server:
    container_name: matter-server
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    network_mode: host
    volumes:
      - /opt/matter-server/data:/data:rw
      - /run/dbus:/run/dbus:ro
    command: >
      --storage-path /data
      --paa-root-cert-dir /data/credentials
